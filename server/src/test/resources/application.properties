
# Datasource configuration for MySQL
spring.datasource.url=jdbc:tc:mysql:8.2.0:///form76-generator-db
spring.datasource.username=root
spring.datasource.password=test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

form76-generator.cron.schedule=0 0 0 1 * *

app.cors.allowed-origins=http://form76generator.com

# JPA/Hibernate properties
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update

mylink.api.token=1234567890

mylink.host=test
mylink.door.opening.report.uri=/test/

spring.mail.host=form76emailserver.com
spring.mail.port=1234
spring.mail.username=testemailuser
spring.mail.password=testpwd
form76-generator.emails.enabled=true

google.cloud.project-id=123456
google.cloud.bucket.name=testbucket
google.cloud.bucket.credentialsFile=credFile

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=kafka.consumer.report.generation.request
spring.kafka.consumer.max-poll-records=3
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

form76-generator.output.file.name.prefix=Report_Form76_


